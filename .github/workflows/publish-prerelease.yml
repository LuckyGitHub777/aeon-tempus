name: publish-prerelease
on:
  push:
    branches: [main]
    paths:
      - "releases/AEON_TEMPUS_ECLIPSE_NODE_THETA7_v1.1.2-rc1.html"
      - "RELEASE_SHA256SUMS.txt"
      - ".github/workflows/publish-prerelease.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify release checksum contract
        run: |
          expected="$(awk '{print $1}' RELEASE_SHA256SUMS.txt)"
          actual="$(sha256sum releases/AEON_TEMPUS_ECLIPSE_NODE_THETA7_v1.1.2-rc1.html | awk '{print $1}')"
          test "$expected" = "$actual"
          grep -qx "$expected  AEON_TEMPUS_ECLIPSE_NODE_THETA7_v1.1.2-rc1.html" RELEASE_SHA256SUMS.txt
      - name: Publish or verify pilot candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.1.2-rc1"
          ASSET="AEON_TEMPUS_ECLIPSE_NODE_THETA7_v1.1.2-rc1.html"
          EXPECTED="$(awk '{print $1}' RELEASE_SHA256SUMS.txt)"
          if gh release view "$TAG" >/dev/null 2>&1; then
            rm -rf /tmp/theta7-release && mkdir -p /tmp/theta7-release
            gh release download "$TAG" -p "$ASSET" -D /tmp/theta7-release
            ACTUAL="$(sha256sum "/tmp/theta7-release/$ASSET" | awk '{print $1}')"
            test "$EXPECTED" = "$ACTUAL" || {
              echo "Existing $TAG asset differs from repository bytes; create a successor version."
              exit 1
            }
            echo "$TAG already exists and asset digest matches; leaving immutable release bytes unchanged."
            exit 0
          fi
          gh release create "$TAG" \
            releases/AEON_TEMPUS_ECLIPSE_NODE_THETA7_v1.1.2-rc1.html \
            RELEASE_SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "AEON-TEMPUS Theta-7 v1.1.2-rc1" \
            --notes "UX-corrective technically verified pilot candidate. Symbolic, human-governed uncertainty-reflection and decision-support interface. Download the HTML and RELEASE_SHA256SUMS.txt into the same folder, verify the checksum, then open the HTML in a modern browser. This prerelease does not establish paranormal or scientific claims." \
            --prerelease

name: publish-prerelease
on:
  push:
    branches: [main]
    paths:
      - "releases/AEON_TEMPUS_ECLIPSE_NODE_THETA7_v1.1.3-rc1.html"
      - "RELEASE_SHA256SUMS.txt"
      - ".github/workflows/publish-prerelease.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify release checksum contract
        run: |
          expected="$(awk '{print $1}' RELEASE_SHA256SUMS.txt)"
          actual="$(sha256sum releases/AEON_TEMPUS_ECLIPSE_NODE_THETA7_v1.1.3-rc1.html | awk '{print $1}')"
          test "$expected" = "$actual"
          grep -qx "$expected  AEON_TEMPUS_ECLIPSE_NODE_THETA7_v1.1.3-rc1.html" RELEASE_SHA256SUMS.txt
      - name: Publish or verify current prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.1.3-rc1"
          ASSET="AEON_TEMPUS_ECLIPSE_NODE_THETA7_v1.1.3-rc1.html"
          EXPECTED="$(awk '{print $1}' RELEASE_SHA256SUMS.txt)"
          if gh release view "$TAG" >/dev/null 2>&1; then
            rm -rf /tmp/theta7-release && mkdir -p /tmp/theta7-release
            gh release download "$TAG" -p "$ASSET" -D /tmp/theta7-release
            ACTUAL="$(sha256sum "/tmp/theta7-release/$ASSET" | awk '{print $1}')"
            test "$EXPECTED" = "$ACTUAL" || { echo "Existing $TAG asset differs from repository bytes; create a successor version."; exit 1; }
            echo "$TAG already exists and digest matches; leaving release bytes unchanged."
          else
            gh release create "$TAG"               releases/AEON_TEMPUS_ECLIPSE_NODE_THETA7_v1.1.3-rc1.html               RELEASE_SHA256SUMS.txt               --target "$GITHUB_SHA"               --title "AEON-TEMPUS Theta-7 v1.1.3-rc1"               --notes "Privacy and data-loss corrective pilot candidate. Download the HTML and RELEASE_SHA256SUMS.txt into the same folder, verify the checksum, then open the HTML in a modern browser. This prerelease does not establish paranormal or scientific claims."               --prerelease
          fi
      - name: Mark older prereleases superseded
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prefix="Superseded by v1.1.3-rc1 — download the current release instead."
          for old in v1.1.1-rc1 v1.1.2-rc1; do
            body="$(gh release view "$old" --json body --jq '.body // ""')"
            case "$body" in "$prefix"*) continue ;; esac
            if [ -n "$body" ]; then body="$prefix"$'\n\n'"$body"; else body="$prefix"; fi
            gh release edit "$old" --notes "$body"
          done

name: deploy-pages
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "index.html"
      - ".github/workflows/deploy-pages.yml"
  schedule:
    - cron: "17 * * * *"
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Detect Pages readiness
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code="$(curl -sS -o /tmp/pages.json -w '%{http_code}' \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages")"
          if [ "$code" = "200" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "GitHub Pages is enabled; continuing deployment."
          elif [ "$code" = "404" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "GitHub Pages is not enabled yet; deployment skipped safely."
          else
            echo "Unexpected GitHub Pages API status: $code"
            cat /tmp/pages.json
            exit 1
          fi
      - name: Configure GitHub Pages
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Stage public site
        if: steps.pages.outputs.enabled == 'true'
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          touch _site/.nojekyll
      - name: Upload Pages artifact
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site
      - name: Deploy
        if: steps.pages.outputs.enabled == 'true'
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Pages enablement pending
        if: steps.pages.outputs.enabled != 'true'
        run: |
          echo "No deployment was attempted because GitHub Pages is not enabled."
          echo "After the one-time repository Pages setting is enabled, the scheduled workflow will deploy automatically."

name: deploy-pages
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "index.html"
      - ".github/workflows/deploy-pages.yml"
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Stage public site
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          touch _site/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Verify live site
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          test -n "$SITE_URL"
          for attempt in $(seq 1 20); do
            body="$(curl -fsSL --connect-timeout 10 --max-time 20 "$SITE_URL" || true)"
            if printf '%s' "$body" | grep -Fq 'ECLIPSE NODE' &&                printf '%s' "$body" | grep -Fq 'v1.1.3-rc1'; then
              echo "Verified live site: $SITE_URL"
              exit 0
            fi
            echo "Live verification attempt $attempt/20 not ready yet."
            sleep 3
          done
          echo "Public site did not present the expected AEON-TEMPUS markers."
          exit 1

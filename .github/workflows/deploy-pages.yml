name: deploy-pages
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "tests/test_live.py"
      - ".github/workflows/deploy-pages.yml"
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Stage public site
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          touch _site/.nojekyll
          python3 - <<'PY'
          from pathlib import Path
          import struct, math
          size=16
          header=struct.pack('<HHH',0,1,1)
          pixel_offset=6+16+40
          xor_size=size*size*4
          and_row=((size+31)//32)*4
          bytes_in_res=40+xor_size+and_row*size
          entry=struct.pack('<BBBBHHII',size,size,0,0,1,32,bytes_in_res,22)
          dib=struct.pack('<IIIHHIIIIII',40,size,size*2,1,32,0,xor_size,0,0,0,0)
          pixels=bytearray()
          cx=cy=(size-1)/2
          for y in range(size-1,-1,-1):
              for x in range(size):
                  r=math.hypot(x-cx,y-cy)
                  if 4.7 <= r <= 6.5:
                      pixels += bytes((112,169,201,255))
                  elif r < 1.5:
                      pixels += bytes((220,232,238,255))
                  else:
                      pixels += bytes((0,0,0,0))
          mask=bytes(and_row*size)
          Path('_site/favicon.ico').write_bytes(header+entry+dib+pixels+mask)
          page=Path('_site/index.html')
          html=page.read_text(encoding='utf-8')
          if 'rel="icon"' not in html:
              html=html.replace('</head>','  <link rel="icon" href="./favicon.ico">\n</head>',1)
              page.write_text(html,encoding='utf-8')
          PY
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Verify live markers
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          test -n "$SITE_URL"
          for attempt in $(seq 1 20); do
            body="$(curl -fsSL --connect-timeout 10 --max-time 20 "$SITE_URL" || true)"
            if [[ "$body" == *"ECLIPSE NODE"* && "$body" == *"v1.1.3-rc1"* ]]; then
              echo "Verified live markers: $SITE_URL"
              exit 0
            fi
            echo "Live verification attempt $attempt/20 not ready yet."
            sleep 3
          done
          echo "Public site did not present the expected AEON-TEMPUS markers."
          exit 1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.x'
      - name: Install live UX test dependency
        run: python -m pip install --disable-pip-version-check playwright==1.57.0
      - name: Detect system browser
        run: |
          BROWSER_PATH="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$BROWSER_PATH"
          echo "THETA7_BROWSER_PATH=$BROWSER_PATH" >> "$GITHUB_ENV"
      - name: Verify live hosted UX
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: python tests/test_live.py
